<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有票为证 · 四主题视觉规范原型</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* ============ 主题变量：四套 ============ */
:root{
  --font-sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-play:"ZCOOL KuaiLe","Noto Sans SC",cursive;
}
/* 1 温馨手账 */
body[data-theme="warm"]{
  --bg:#FFF6EF; --card:#FFFFFF; --primary:#FF8FA3; --accent:#FFB26B;
  --soft:#F7C8D0; --text:#5A4038; --text2:#9B8A82; --border:#F6D9CF;
  --onprimary:#FFFFFF; --chip:#FFEFF3; --radius:22px; --shadow:0 10px 30px rgba(255,143,163,.18);
  --deco:#FF8FA3;
}
/* 2 清爽自然 */
body[data-theme="fresh"]{
  --bg:#F3F7F4; --card:#FFFFFF; --primary:#4FB286; --accent:#2F7A5B;
  --soft:#A8E6CF; --text:#24423A; --text2:#6E8A80; --border:#D8E8DF;
  --onprimary:#FFFFFF; --chip:#E9F6F0; --radius:16px; --shadow:0 10px 28px rgba(79,178,134,.16);
  --deco:#4FB286;
}
/* 3 趣味拼贴 */
body[data-theme="collage"]{
  --bg:#FBF3E2; --card:#FFFFFF; --primary:#5FB4E6; --accent:#FF7BAC;
  --soft:#FFD166; --text:#223A5E; --text2:#6E809F; --border:#E8D9BC;
  --onprimary:#FFFFFF; --chip:#FDEFF5; --radius:10px; --shadow:4px 4px 0 #223A5E;
  --deco:#FF7BAC;
  --playful:1;
}
/* 4 星光夜幕 */
body[data-theme="night"]{
  --bg:#0C1226; --card:#141B33; --primary:#E9C46A; --accent:#8FA0FF;
  --soft:#F4E3B2; --text:#F2EFE6; --text2:#9AA3C7; --border:#2C3A66;
  --onprimary:#221a08; --chip:#1E2748; --radius:14px; --shadow:0 12px 34px rgba(0,0,0,.5);
  --deco:#E9C46A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);transition:background .4s,color .4s;min-height:100vh}

/* ============ 顶栏：主题切换 ============ */
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  border-bottom:1px solid var(--border);padding:14px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px;letter-spacing:1px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--text2);letter-spacing:2px}
.switch{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.seg{border:1.5px solid var(--border);background:var(--card);color:var(--text2);
  padding:10px 16px;border-radius:999px;font-size:13px;cursor:pointer;transition:.25s;font-family:inherit;
  min-height:44px}
.seg:hover{border-color:var(--primary)}
.seg.active{background:var(--primary);color:var(--onprimary);border-color:var(--primary);font-weight:700}

/* ============ 主体布局 ============ */
.wrap{max-width:1240px;margin:0 auto;padding:26px 22px 60px;display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:26px;align-items:start}
@media(max-width:920px){.wrap{grid-template-columns:1fr}}

/* ============ 规范卡 ============ */
.spec{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;transition:.4s}
.spec-head{padding:22px 26px 18px;display:flex;align-items:center;gap:18px;position:relative;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 14%,var(--card)),var(--card))}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--primary);
  box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 35%,transparent);flex:none;background:var(--soft)}
.spec-title h1{font-size:34px;font-weight:900;letter-spacing:2px;line-height:1.05}
.spec-title .en{font-size:13px;color:var(--accent);letter-spacing:4px;margin-top:6px;font-weight:500}
.spec-title .slogan{font-size:12px;color:var(--text2);margin-top:8px}

.sec{padding:20px 26px;border-top:1px dashed var(--border)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.sec-num{width:24px;height:24px;border-radius:8px;background:var(--primary);color:var(--onprimary);
  font-size:13px;font-weight:800;display:grid;place-items:center;flex:none}
.sec-h h2{font-size:17px;font-weight:800}
.sec-h .tip{font-size:11px;color:var(--text2);margin-left:auto}

/* 色板 */
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sw{text-align:center}
.sw .dot{width:54px;height:54px;border-radius:14px;margin:0 auto 8px;border:1px solid var(--border);
  box-shadow:inset 0 -10px 18px rgba(0,0,0,.06)}
.sw .name{font-size:12px;font-weight:600}
.sw .hex{font-size:11px;color:var(--text2);margin-top:2px;font-family:ui-monospace,Menlo,monospace}

/* 字体层级 */
.type-sample{border-left:3px solid var(--primary);padding:4px 0 4px 16px;margin-bottom:14px}
.type-main{font-size:40px;font-weight:900;letter-spacing:2px;line-height:1.1}
.type-sub{font-size:20px;font-weight:500;margin-top:10px;opacity:.9}
.type-body{font-size:14px;color:var(--text2);margin-top:10px}
.type-list{display:grid;gap:9px;font-size:12.5px;margin-top:4px}
.type-list b{font-weight:700}
.type-list span{color:var(--text2)}

/* 装饰元素 */
.deco-item{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px dotted var(--border)}
.deco-item:last-child{border-bottom:0}
.deco-ic{width:56px;height:56px;flex:none;border-radius:12px;background:var(--chip);
  display:grid;place-items:center}
.deco-ic svg{width:38px;height:38px}
.deco-item .dn{font-size:13.5px;font-weight:700}
.deco-item .dd{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.5}

/* ============ 小程序预览 ============ */
.phone{position:sticky;top:86px;width:100%;max-width:340px;margin:0 auto}
.frame{background:#000;border-radius:46px;padding:12px;box-shadow:var(--shadow)}
.screen{background:var(--bg);border-radius:36px;overflow:hidden;height:680px;position:relative;
  display:flex;flex-direction:column;transition:.4s}
.notch{height:26px;display:flex;align-items:center;justify-content:center;gap:6px}
.notch::after{content:"";width:90px;height:18px;background:#000;border-radius:12px;opacity:.85}
.nav{padding:8px 18px 14px;display:flex;align-items:center;gap:10px}
.nav img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--primary)}
.nav .t{font-weight:900;font-size:17px;letter-spacing:1px}
.nav .t small{display:block;font-size:10px;color:var(--text2);font-weight:400;letter-spacing:1px}
.hero{margin:0 16px 12px;padding:16px;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--primary),var(--accent));color:var(--onprimary)}
.hero .h-t{font-size:15px;font-weight:800}
.hero .h-s{font-size:11px;opacity:.92;margin-top:5px}
.ticket-list{flex:1;overflow:auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.tk{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px;
  display:flex;gap:12px;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.tk .stub{width:46px;height:56px;border-radius:8px;flex:none;background:var(--soft);
  display:grid;place-items:center;color:var(--primary)}
.tk .stub svg{width:26px;height:26px}
.tk .info{flex:1;min-width:0}
.tk .ti{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .meta{font-size:11px;color:var(--text2);margin-top:4px}
.tk .tag{font-size:10px;background:var(--chip);color:var(--primary);padding:2px 8px;border-radius:999px}
.tabbar{display:flex;border-top:1px solid var(--border);background:var(--card)}
.tab{flex:1;text-align:center;padding:9px 0 12px;font-size:11px;color:var(--text2)}
.tab.on{color:var(--primary);font-weight:700}
.tab svg{width:20px;height:20px;display:block;margin:0 auto 3px}
.screen-note{position:absolute;inset:auto 0 0 0;height:6px}

@media(max-width:920px){.phone{position:relative;top:0}.wrap{gap:20px}}
</style>
</head>

const PLANE_IC='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1L13 21v-1.5L11.5 18v-4.5z"/></svg>';

function render(key){
  const t=THEMES[key];
  document.body.dataset.theme=key;
  document.querySelectorAll('.seg').forEach(b=>b.classList.toggle('active',b.dataset.t===key));
  document.getElementById('tName').textContent=t.name;
  document.getElementById('tEn').textContent=t.en;
  document.getElementById('navTheme').textContent=t.nav;
  document.getElementById('heroT').textContent=t.heroT;
  document.getElementById('heroS').textContent=t.heroS;
  document.getElementById('cTip').textContent='6 种品牌色';
  const usePlay=t.play;
  document.getElementById('tMain').style.fontFamily=usePlay?'var(--font-play)':'';
  document.getElementById('tSub').style.fontFamily=usePlay?'var(--font-play)':'';

  // 色板
  document.getElementById('swatches').innerHTML=t.colors.map(c=>
    `<div class="sw"><div class="dot" style="background:${c[1]}"></div>
     <div class="name">${c[0]}</div><div class="hex">${c[1]}</div></div>`).join('');
  // 字体层级
  document.getElementById('typeList').innerHTML=t.types.map(x=>
    `<div><b>${x[0]}</b>　${x[1]}<br><span>${x[2]}</span></div>`).join('');
  // 装饰
  document.getElementById('decoList').innerHTML=t.decos.map(d=>
    `<div class="deco-item"><div class="deco-ic"><svg viewBox="0 0 36 36">${d.ic}</svg></div>
     <div><div class="dn">${d.n}</div><div class="dd">${d.d}</div></div></div>`).join('');
  // 票根列表
  document.getElementById('ticketList').innerHTML=t.tickets.map(k=>
    `<div class="tk"><div class="stub">${PLANE_IC}</div>
     <div class="info"><div class="ti">${k[0]}</div><div class="meta">${k[1]}</div></div>
     <span class="tag">${k[2]}</span></div>`).join('');
}

document.getElementById('switch').addEventListener('click',e=>{
  const b=e.target.closest('.seg'); if(b) render(b.dataset.t);
});
render('warm');
</script>
